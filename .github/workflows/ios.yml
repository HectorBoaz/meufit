name: Build iOS (.ipa sem assinatura)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto nativo (expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Remover entitlement de push (Apple ID gratuito não suporta)
        run: |
          for f in ios/*/*.entitlements; do
            [ -f "$f" ] || continue
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" 2>/dev/null || true
            echo "== $f"; cat "$f"
          done

      - name: Instalar CocoaPods
        run: cd ios && pod install

      - name: Compilar (Release, sem assinatura)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcbeautify --renderer github-actions

      - name: Empacotar .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)
          echo "App: $APP"
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "::error::main.jsbundle não encontrado dentro do .app — o JS não foi embutido"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MaizaFit.ipa Payload
          ls -lh MaizaFit.ipa

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: MaizaFit-ipa
          path: MaizaFit.ipa
          retention-days: 30

      - name: Publicar na release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest MaizaFit.ipa \
            --title "Maiza Fit – build ${{ github.run_number }}" \
            --notes "Build automático do commit ${{ github.sha }}. Baixe o MaizaFit.ipa e instale pelo AltStore." \
            --latest
